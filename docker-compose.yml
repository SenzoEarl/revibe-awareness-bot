services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: revibe
      POSTGRES_USER: revibe
      POSTGRES_PASSWORD: revibe
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro

volumes:
  postgres_data:
