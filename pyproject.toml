[project]
name = "revibe-awareness-bot"
version = "0.1.0"
description = "Evidence-first consumer information monitoring and responsible social-media publishing platform"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "tenacity>=9,<10",
  "rapidfuzz>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<6", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
